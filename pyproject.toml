[project]
name = "aps-failure-prediction-service"
version = "1.0.0"
description = "Production inference service for heavy-truck APS failure prediction, with batch scoring, drift detection and model auditability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KanishK" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "structlog>=24.4",
    # --- ML ---
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    # CPU-only on Linux: plain `xgboost` pulls ~500MB of CUDA wheels
    # (nvidia-nccl) that an inference container will never use. `xgboost-cpu`
    # is the official CPU distribution and provides the same `xgboost` module,
    # so no application code changes. macOS/Windows wheels are CPU-only anyway.
    "xgboost-cpu>=2.1; sys_platform == 'linux'",
    "xgboost>=2.1; sys_platform != 'linux'",
    "joblib>=1.4",
    "scipy>=1.13",
    # --- scheduling ---
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "T20", "SIM", "RET", "C4", "NPY", "PD"]
ignore = [
    "B008",
    "PD011", # .values is intentional where a numpy array is wanted
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
"scripts/*" = ["T20"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
exclude = ["alembic/versions/", "^notebooks/", "^build/"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "xgboost.*", "joblib.*", "apscheduler.*", "scipy.*", "scripts.*"]
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:xgboost.*",
]

[tool.coverage.run]
source = ["app"]
