name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # The suite is fully offline: SQLite, synthetic data and a stubbed LLM.
  LLM_PROVIDER: stub

jobs:
  quality:
    name: Lint, type-check and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy app scripts

      - name: Test (pytest + coverage)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  train:
    name: Train end to end and verify the artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Train on the committed sample
        run: python scripts/train.py --json reports/training.json

      - name: Verify the artifact is complete and honest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from app.ml.registry import ModelRegistry

          registry = ModelRegistry("artifacts")
          version = registry.current_version()
          assert version, "training produced no current model"
          metadata = registry.load_metadata(version)

          # Everything needed to audit a prediction must be present.
          assert metadata.model_type in {"random_forest", "xgboost"}
          assert metadata.feature_list, "no feature list recorded"
          assert metadata.accepted_feature_list, "no accepted feature list recorded"
          assert metadata.feature_stats, "no training stats recorded (drift would be impossible)"
          assert metadata.training_rows > 0 and metadata.test_rows > 0
          assert 0.0 < metadata.decision_threshold <= 1.0
          assert metadata.dataset_fingerprint, "no dataset fingerprint"
          assert metadata.library_versions.get("scikit-learn")

          # Metrics must be measured values, with the classification metrics
          # present and the v1 regression metrics namespaced, not headline.
          for key in ("roc_auc", "pr_auc", "recall", "precision", "total_cost", "confusion"):
              assert key in metadata.metrics, f"missing metric: {key}"
          assert "legacy_regression" in metadata.metrics
          assert len(metadata.candidate_comparison) >= 1

          # The model must load and score.
          loaded = registry.load(version)
          print(f"OK  version={version} type={metadata.model_type} "
                f"features={metadata.n_features} threshold={metadata.decision_threshold}")
          print(f"    roc_auc={metadata.metrics['roc_auc']:.4f} "
                f"pr_auc={metadata.metrics['pr_auc']:.4f} cost={metadata.metrics['total_cost']}")
          PY

      - name: Verify drift detection fires in both directions
        run: python scripts/simulate_drift.py

      - name: Upload the training report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: reports/training.json
          if-no-files-found: error

  migrations:
    name: Alembic migrations against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aps
          POSTGRES_PASSWORD: aps
          POSTGRES_DB: aps
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aps -d aps"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://aps:aps@localhost:5432/aps

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Upgrade, downgrade and upgrade again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify the migration matches the ORM models
        run: |
          # Autogenerate must produce an empty diff, otherwise a model change
          # was committed without a migration.
          alembic check

  docker:
    name: Docker stack builds, trains and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Start the stack (db + api + worker)
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke-test the API
        run: |
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"model_loaded":true'
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"operator","password":"operator"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          # The model's own feature list drives the request, so this stays
          # correct if the schema changes.
          curl -fsS http://localhost:8000/models/current -H "Authorization: Bearer $TOKEN" \
            > /tmp/model.json
          python - <<'PY' > /tmp/record.json
          import json
          meta = json.load(open("/tmp/model.json"))
          features = {name: 1.0 for name in meta["accepted_feature_list"]}
          json.dump({"vehicle_id": "CI-1", "features": features}, open("/tmp/record.json", "w"))
          PY
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/record.json | tee /dev/stderr | grep -q '"risk_band"'

      - name: Smoke-test batch scoring
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"operator","password":"operator"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          head -51 data/sample/aps_sample_train.csv | cut -d, -f2- > /tmp/batch.csv
          JOB=$(curl -fsS -X POST http://localhost:8000/predict/batch \
            -H "Authorization: Bearer $TOKEN" -F "file=@/tmp/batch.csv" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["job_id"])')
          for _ in $(seq 1 60); do
            STATUS=$(curl -fsS "http://localhost:8000/jobs/$JOB" \
              -H "Authorization: Bearer $TOKEN" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            [ "$STATUS" = "succeeded" ] && break
            [ "$STATUS" = "failed" ] && { echo "job failed"; exit 1; }
            sleep 2
          done
          test "$STATUS" = "succeeded"
          curl -fsS "http://localhost:8000/jobs/$JOB" -H "Authorization: Bearer $TOKEN" \
            | grep -q '"scored_rows":50'

      - name: Smoke-test the maintenance note
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"operator","password":"operator"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X POST http://localhost:8000/insights/maintenance-note \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"failure_probability":0.91,"vehicle_id":"CI-1"}' \
            | tee /dev/stderr | grep -q '"generated_by"'

      - name: Verify the worker is running the scheduler
        run: |
          docker compose exec -T worker curl -fsS http://localhost:8001/health \
            | tee /dev/stderr | grep -q '"scheduler_running":true'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
